# Wird auf dem Mac-Server von GitHub mit XcodeGen in ein Xcode-Projekt verwandelt.
name: Motiv
options:
  bundleIdPrefix: com.emreoezcakal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Motiv:
    type: application
    platform: iOS
    sources:
      - path: Motiv
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emreoezcakal.motiv
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Motiv
        INFOPLIST_KEY_NSCameraUsageDescription: Motiv braucht die Kamera, um Fotos aufzunehmen und dir beim Bildaufbau zu helfen.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Motiv speichert deine Fotos in der Fotos-App.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
