<!doctype html>
<html lang="de" data-app="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kurs">
<meta name="theme-color" content="#08090D">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kurs · Schulplaner</title>
<style>
  /* =========================================================
     Tokens · Hell = warmes Papier, Dunkel = Standard der App
     ========================================================= */
  :root{
    --bg:#F5F2ED; --side:#EFEBE4; --surface:#FFFFFF; --surface-2:#F5F1EB; --surface-3:#EAE5DD;
    --ink:#17140F; --ink-2:#433E37; --mute:#6E665D; --faint:#ADA59A;
    --line:rgba(23,20,15,.08); --line-2:rgba(23,20,15,.16);
    --accent:#C94A1F; --accent-ink:#FFFFFF; --accent-soft:rgba(201,74,31,.10); --accent-text:#B4441C;
    --grad:linear-gradient(135deg,#FF8A5C 0%,#F2557A 55%,#9B6BFF 100%);
    --grad-text:linear-gradient(120deg,#D9481F 0%,#C0306A 55%,#6A3FD9 100%);
    --good:#13804F; --warn:#A35F00; --bad:#C42A4A;
    --b5:#0E7A57; --b4:#3550D6; --b3:#5B6479; --b2:#A35F00; --b1:#C42A4A;
    --fc0:#2F6FDB; --fc1:#E8590C; --fc2:#0B8A5A; --fc3:#9C36B5; --fc4:#D6336C;
    --fc5:#0C8599; --fc6:#B7791F; --fc7:#5F3DC4; --fc8:#5C940D; --fc9:#6B7488;
    --tint:12%; --tint-strong:20%;
    --glass:rgba(255,255,255,.66); --glass-line:rgba(23,20,15,.08); --glass-hi:inset 0 1px 0 rgba(255,255,255,.8);
    --aura1:rgba(255,138,92,.22); --aura2:rgba(155,107,255,.14); --aura3:rgba(40,190,170,.10);
    --edge:inset 0 0 0 1px rgba(23,20,15,.05);
    --shadow:0 1px 2px rgba(23,20,15,.04), 0 10px 30px -16px rgba(23,20,15,.22);
    --shadow-pop:0 30px 80px -24px rgba(23,20,15,.38);
    --scrim:rgba(23,20,15,.30);
    --r:20px;
    --ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --round:ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]):not(.theme-light){
      --bg:#08090D; --side:#101219; --surface:#13151C; --surface-2:#1B1E27; --surface-3:#262A36;
      --ink:#F5F3F0; --ink-2:#C2C5CD; --mute:#8E93A0; --faint:#5B606C;
      --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
      --accent:#FF8A5C; --accent-ink:#1B0F0A; --accent-soft:rgba(255,138,92,.14); --accent-text:#FFAD8A;
      --grad-text:linear-gradient(120deg,#FFB089 0%,#FF7A8E 50%,#B49BFF 100%);
      --good:#4FD39B; --warn:#F0B35E; --bad:#FF8AA3;
      --b5:#4FD39B; --b4:#8EA2FF; --b3:#A9B2C4; --b2:#F0B35E; --b1:#FF8AA3;
      --fc0:#74A7FF; --fc1:#FF9A5C; --fc2:#3DD39A; --fc3:#D58BEA; --fc4:#FF7EA8;
      --fc5:#45CFE0; --fc6:#F0C04A; --fc7:#A08CFF; --fc8:#A9E34B; --fc9:#A9B3C6;
      --tint:16%; --tint-strong:26%;
      --glass:rgba(24,26,35,.58); --glass-line:rgba(255,255,255,.09); --glass-hi:inset 0 1px 0 rgba(255,255,255,.07);
      --aura1:rgba(255,128,84,.16); --aura2:rgba(140,110,255,.15); --aura3:rgba(40,200,180,.08);
      --edge:inset 0 0 0 1px rgba(255,255,255,.05);
      --shadow:0 12px 34px -20px rgba(0,0,0,.95);
      --shadow-pop:0 30px 80px -20px rgba(0,0,0,.85);
      --scrim:rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"], :root.theme-dark{
    --bg:#08090D; --side:#101219; --surface:#13151C; --surface-2:#1B1E27; --surface-3:#262A36;
    --ink:#F5F3F0; --ink-2:#C2C5CD; --mute:#8E93A0; --faint:#5B606C;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
    --accent:#FF8A5C; --accent-ink:#1B0F0A; --accent-soft:rgba(255,138,92,.14); --accent-text:#FFAD8A;
    --grad-text:linear-gradient(120deg,#FFB089 0%,#FF7A8E 50%,#B49BFF 100%);
    --good:#4FD39B; --warn:#F0B35E; --bad:#FF8AA3;
    --b5:#4FD39B; --b4:#8EA2FF; --b3:#A9B2C4; --b2:#F0B35E; --b1:#FF8AA3;
    --fc0:#74A7FF; --fc1:#FF9A5C; --fc2:#3DD39A; --fc3:#D58BEA; --fc4:#FF7EA8;
    --fc5:#45CFE0; --fc6:#F0C04A; --fc7:#A08CFF; --fc8:#A9E34B; --fc9:#A9B3C6;
    --tint:16%; --tint-strong:26%;
    --glass:rgba(24,26,35,.58); --glass-line:rgba(255,255,255,.09); --glass-hi:inset 0 1px 0 rgba(255,255,255,.07);
    --aura1:rgba(255,128,84,.16); --aura2:rgba(140,110,255,.15); --aura3:rgba(40,200,180,.08);
    --edge:inset 0 0 0 1px rgba(255,255,255,.05);
    --shadow:0 12px 34px -20px rgba(0,0,0,.95);
    --shadow-pop:0 30px 80px -20px rgba(0,0,0,.85);
    --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
  :root.theme-light{ color-scheme:light }

  /* =========================================================
     Grundgerüst
     ========================================================= */
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--ui); font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }
  /* Aurora: weiche Farbflächen hinter allem – ruhig, nur in den Freiräumen sichtbar */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(55% 42% at 8% -6%, var(--aura1), transparent 70%),
      radial-gradient(42% 38% at 96% 4%, var(--aura2), transparent 70%),
      radial-gradient(60% 46% at 62% 108%, var(--aura3), transparent 70%);
  }
  button, input, select, textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  button:disabled{opacity:.45; cursor:default}
  .num{font-family:var(--round); font-variant-numeric:tabular-nums}
  svg.i{width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
  svg.i.sm{width:18px; height:18px}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .gt{background:var(--grad-text); -webkit-background-clip:text; background-clip:text; color:transparent}

  .app{--sw:240px; display:grid; grid-template-columns:var(--sw) minmax(0,1fr); min-height:100dvh}
  @media (min-width:1000px){ .app{--sw:258px} }
  @media (min-width:1150px){ .app{--sw:272px} }

  /* ---------- Seitenleiste (iPad): schwebendes Glas ---------- */
  .side{
    position:sticky; top:12px; height:calc(100dvh - 24px); margin:12px 0 12px 12px; overflow:auto;
    background:var(--glass); backdrop-filter:blur(30px) saturate(170%); -webkit-backdrop-filter:blur(30px) saturate(170%);
    border:1px solid var(--glass-line); border-radius:26px; box-shadow:var(--glass-hi), var(--shadow);
    padding:18px 12px 14px; display:flex; flex-direction:column; gap:2px;
  }
  .side-head{display:flex; align-items:center; gap:11px; padding:0 8px 16px}
  .logo{width:38px; height:38px; border-radius:12px; flex:none; display:block; box-shadow:0 6px 16px -8px rgba(242,85,122,.6)}
  .side-head b{font-size:19px; font-weight:800; letter-spacing:-.02em; display:block; line-height:1.1}
  .side-head span{font-size:12.5px; color:var(--mute)}
  .newbtn{
    display:flex; align-items:center; justify-content:center; gap:8px; margin:0 2px 14px; padding:12px 14px;
    border:0; border-radius:15px; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:15.5px;
    box-shadow:0 10px 24px -14px var(--accent);
  }
  .newbtn:active{transform:scale(.98)}
  .nav-l{font-size:11.5px; font-weight:700; color:var(--mute); text-transform:uppercase; letter-spacing:.08em; padding:16px 12px 6px}
  .nav{
    display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; border:0; border-radius:14px;
    background:transparent; color:var(--ink-2); font-size:16px; font-weight:550; text-align:left;
  }
  .nav:hover{background:var(--line)}
  .nav[aria-current="page"]{background:color-mix(in srgb, var(--ink) 9%, transparent); color:var(--ink); font-weight:650}
  .nav[aria-current="page"] svg{color:var(--accent)}
  .nav .bdg{margin-left:auto; font-size:13.5px; font-weight:650; color:var(--mute); font-family:var(--round); font-variant-numeric:tabular-nums}
  .nav .bdg.alert{color:var(--bad)}
  .side-foot{margin-top:auto; padding:14px 12px 2px; font-size:12.5px; color:var(--mute); display:flex; align-items:center; gap:8px}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--good); flex:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent)}
  .dot.local{background:var(--warn); box-shadow:0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent)}

  /* ---------- Hauptbereich ---------- */
  .main{min-width:0; padding:34px clamp(16px, 3.4vw, 44px) 64px}
  .view{max-width:1080px; margin:0 auto; container-type:inline-size}
  .lt{display:flex; align-items:flex-start; gap:12px; margin-bottom:24px}
  .lt > div:first-child{flex:1; min-width:0}
  .lt h1{font-size:38px; line-height:1.06; font-weight:800; letter-spacing:-.03em; margin:0}
  .lt .sub{font-size:15px; color:var(--mute); margin-top:6px}
  .lt .kick{font-size:13px; font-weight:700; color:var(--mute); text-transform:uppercase; letter-spacing:.07em; margin-bottom:6px}
  .lt-actions{display:flex; gap:8px; align-items:center; flex:none; margin-top:4px}

  .iconbtn{
    width:40px; height:40px; border-radius:14px; border:0; background:var(--surface); color:var(--ink-2);
    display:grid; place-items:center; box-shadow:var(--edge), var(--shadow); flex:none;
  }
  .iconbtn:hover{color:var(--ink)}
  .iconbtn.plain{background:transparent; box-shadow:none; color:var(--mute)}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    padding:10px 16px; border-radius:14px; border:0; background:var(--surface-2); color:var(--ink);
    font-size:15px; font-weight:600; white-space:nowrap; touch-action:manipulation;
  }
  .card .btn, .list .btn{background:var(--surface-3)}
  .btn:hover{filter:brightness(1.05)}
  .btn.primary{background:var(--accent); color:var(--accent-ink); box-shadow:0 8px 20px -12px var(--accent)}
  .btn.sm{padding:7px 12px; font-size:14px; border-radius:12px}
  .btn.ghost{background:transparent; color:var(--accent-text)}
  .btn.ghost:hover{background:var(--accent-soft)}
  .btn.danger{background:transparent; color:var(--bad)}
  .btn.danger:hover{background:color-mix(in srgb, var(--bad) 10%, transparent)}
  .btn.block{width:100%; padding:14px 16px; font-size:16px}
  .btn:active, .iconbtn:active{transform:scale(.97)}

  .seg{display:inline-flex; padding:3px; border-radius:14px; background:var(--surface-3); gap:2px; max-width:100%; overflow-x:auto}
  .seg button{border:0; background:transparent; color:var(--ink-2); font-size:14px; font-weight:600; padding:7px 14px; border-radius:11px; white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.18)}

  .sec{margin-top:30px}
  .sec:first-child{margin-top:0}
  .sh{display:flex; align-items:baseline; gap:10px; margin:0 4px 10px}
  .sh h2{font-size:19px; font-weight:750; letter-spacing:-.02em; margin:0}
  .sh .cnt{font-size:15px; color:var(--mute); font-family:var(--round); font-variant-numeric:tabular-nums}
  .sh .more{margin-left:auto; font-size:15px; color:var(--accent-text); background:none; border:0; padding:0; font-weight:500}
  .sh.warn h2{color:var(--warn)}

  .card{background:var(--surface); border-radius:var(--r); box-shadow:var(--edge), var(--shadow)}
  .pad{padding:18px}
  .muted{color:var(--mute)}
  .hint{font-size:13.5px; color:var(--mute); line-height:1.5}
  .hint a{color:var(--accent-text)}

  .grid2{display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:30px; align-items:start}
  .grid2 > div > .sec:first-child{margin-top:0}
  @media (max-width:1060px){ .grid2{grid-template-columns:minmax(0,1fr)} .grid2 > div + div > .sec:first-child{margin-top:30px} }

  /* ---------- Listen (iOS-Stil) ---------- */
  .list{background:var(--surface); border-radius:var(--r); box-shadow:var(--edge), var(--shadow); overflow:hidden}
  .row{
    display:flex; align-items:center; gap:14px; padding:12px 16px; position:relative; min-height:58px;
    cursor:pointer; transition:background .12s;
  }
  .row + .row::before{content:""; position:absolute; top:0; left:56px; right:0; height:1px; background:var(--line)}
  .row:hover{background:var(--surface-2)}
  .row.add{color:var(--accent-text); font-weight:500; min-height:52px}
  .row.add .plus{width:26px; height:26px; display:grid; place-items:center}
  .r-body{flex:1; min-width:0}
  .r-title{font-size:16px; font-weight:500; line-height:1.3; overflow-wrap:break-word; hyphens:auto}
  .r-title .r-sub{color:var(--mute); font-weight:400}
  .r-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:3px; font-size:13.5px; color:var(--mute)}
  .r-meta .sep{opacity:.5}
  .fd{width:9px; height:9px; border-radius:50%; background:var(--c, var(--faint)); display:inline-block; flex:none}
  .fname{color:var(--ink-2); font-weight:500}
  .tag{font-size:12px; font-weight:650; padding:2px 7px; border-radius:6px; letter-spacing:.01em; white-space:nowrap}
  .tag.test{background:color-mix(in srgb, var(--warn) var(--tint-strong), transparent); color:var(--warn)}
  .tag.klausur{background:color-mix(in srgb, var(--bad) var(--tint-strong), transparent); color:var(--bad)}
  .tag.referat{background:color-mix(in srgb, var(--fc3) var(--tint-strong), transparent); color:var(--fc3)}
  .tag.abgabe{background:color-mix(in srgb, var(--fc1) var(--tint-strong), transparent); color:var(--fc1)}
  .tag.lernen{background:color-mix(in srgb, var(--good) var(--tint-strong), transparent); color:var(--good)}
  .due.over{color:var(--bad); font-weight:600}
  .due.soon{color:var(--ink-2)}

  /* Runde Abhak-Kreise wie in Erinnerungen */
  .ck{
    appearance:none; -webkit-appearance:none; margin:0; flex:none; width:26px; height:26px; border-radius:50%;
    border:2px solid color-mix(in srgb, var(--c, var(--mute)) 75%, transparent); background:transparent; cursor:pointer;
    display:grid; place-items:center; transition:background .15s, border-color .15s, transform .15s;
  }
  .ck::after{
    content:""; width:10px; height:5px; border-left:2.4px solid var(--surface); border-bottom:2.4px solid var(--surface);
    transform:rotate(-45deg) scale(0); margin-top:-3px; transition:transform .18s ease;
  }
  .ck:checked{background:var(--c, var(--accent)); border-color:var(--c, var(--accent))}
  .ck:checked::after{transform:rotate(-45deg) scale(1)}
  .ck:active{transform:scale(.88)}
  .row.done .r-title{color:var(--mute); text-decoration:line-through; text-decoration-color:var(--faint)}
  .row.done .r-meta{opacity:.7}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
  .ck.pop{animation:pop .32s ease}

  .empty{padding:28px 22px; text-align:center; color:var(--mute); font-size:15px; display:flex; flex-direction:column; align-items:center; gap:9px}
  .empty svg{width:34px; height:34px; color:var(--faint)}
  .empty b{color:var(--ink); font-weight:650; font-size:16.5px}
  .empty span{max-width:42ch}
  .empty .btn{margin-top:6px}

  /* ---------- Heute ---------- */
  /* Kopf: Datum klein darüber, Begrüßung groß; dazu kleine Hinweis-Pillen */
  .hchips{display:flex; gap:8px; flex-wrap:wrap; margin:-10px 0 22px}
  .hchip{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--ink-2);
    background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px)}
  .hchip b{font-family:var(--round); font-variant-numeric:tabular-nums; color:var(--ink)}

  /* Bento: oben die vier Kacheln, die man auf einen Blick braucht */
  .bento{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; margin-bottom:30px}
  @container (max-width:760px){ .bento{grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px} }
  .tile{position:relative; overflow:hidden; background:var(--surface); border-radius:24px; box-shadow:var(--edge), var(--shadow);
    padding:16px 18px; min-height:156px; display:flex; flex-direction:column; gap:8px; min-width:0}
  .tile.span2{grid-column:span 2}
  .t-k{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:750; color:var(--mute); text-transform:uppercase; letter-spacing:.07em}
  .t-s{font-size:14px; color:var(--mute); line-height:1.4}
  .t-s b{color:var(--ink); font-weight:650}
  .t-foot{margin-top:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .t-foot .t-s{flex:1; min-width:0}
  .live{width:8px; height:8px; border-radius:50%; background:var(--c, var(--accent)); box-shadow:0 0 0 0 color-mix(in srgb, var(--c, var(--accent)) 60%, transparent); animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px transparent} 100%{box-shadow:0 0 0 0 transparent}}

  /* Jetzt-Kachel: färbt sich nach dem Fach, das gerade dran ist */
  .now-t{background:radial-gradient(130% 140% at 0% 0%, color-mix(in srgb, var(--c, var(--accent)) 24%, transparent), transparent 62%), var(--surface)}
  .now-main{display:flex; align-items:center; gap:14px; min-width:0}
  .now-main > div{min-width:0}
  .now-main b{display:block; font-size:23px; font-weight:800; letter-spacing:-.02em; line-height:1.12; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .now-main small{display:block; font-size:14px; color:var(--ink-2); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .nbar{height:6px; border-radius:6px; background:color-mix(in srgb, var(--c, var(--accent)) 18%, var(--surface-3)); overflow:hidden}
  .nbar i{display:block; height:100%; border-radius:6px; background:var(--c, var(--accent))}
  .tchips{display:flex; gap:6px; flex-wrap:wrap}
  .tchip{display:inline-flex; align-items:center; gap:6px; border:0; padding:6px 11px 6px 8px; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--ink);
    background:color-mix(in srgb, var(--c) var(--tint-strong), var(--surface-2)); touch-action:manipulation}
  .tchip .emo{font-size:15px; line-height:1}

  /* Fach-Symbol: Emoji auf getönter Fläche (oder Anfangsbuchstabe) */
  .ib{width:36px; height:36px; border-radius:12px; flex:none; display:grid; place-items:center; position:relative; z-index:1;
    background:color-mix(in srgb, var(--c, var(--faint)) var(--tint-strong), var(--surface)); color:var(--c, var(--mute));
    font-size:19px; line-height:1; font-weight:800; font-family:var(--round)}
  .ib.lg{width:52px; height:52px; border-radius:16px; font-size:27px}
  .emo{font-style:normal; line-height:1; flex:none}

  /* Fortschritts-Ring */
  .ring-t{align-items:flex-start}
  .ring-t .rr{display:flex; align-items:center; gap:14px; margin-top:auto; margin-bottom:auto}
  .ring-t .rr > div:last-child{min-width:0}
  .ring{position:relative; width:76px; height:76px; flex:none}
  .ring svg{width:76px; height:76px; transform:rotate(-90deg)}
  .ring .trk{stroke:var(--surface-3)} .ring .val{stroke:url(#g-ring); transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
  .ring.full .val{stroke:var(--good)}
  .ring .lbl{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--round); font-weight:800; font-size:19px; font-variant-numeric:tabular-nums}

    width:100%; height:46px; border-radius:11px; border:1px dashed var(--line-2); background:transparent; color:var(--faint);
    font-size:14px; font-weight:650; padding:0 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; touch-action:manipulation;
  }
  .cell.f{border:0; background:color-mix(in srgb, var(--c) var(--tint-strong), var(--surface)); color:color-mix(in srgb, var(--c) 78%, var(--ink)); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15}
  .cell.f span, .cell.f em{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cell em{font-style:normal; font-size:11px; font-weight:500; opacity:.8}
  .cell.open{outline:2px solid var(--accent); outline-offset:2px}
  .cell .s{display:none !important}
  @media (max-width:860px){ .cell .l{display:none !important} .cell .s{display:block !important} }
  .tt-foot{display:flex; gap:8px; padding:2px 10px 10px; flex-wrap:wrap; align-items:center}

  /* ---------- Einstellungen ---------- */
  .set{display:flex; align-items:center; gap:14px; padding:12px 16px; min-height:58px; position:relative; flex-wrap:wrap}
  .set + .set::before{content:""; position:absolute; top:0; left:16px; right:0; height:1px; background:var(--line)}
  .set .k{flex:1; min-width:180px}
  .set .k b{display:block; font-weight:550}
  .set .k span{font-size:13.5px; color:var(--mute)}
  .set select, .set input[type=date]{border:0; background:var(--surface-2); border-radius:10px; padding:9px 12px; font-size:16px}

  /* ---------- Overlays ---------- */
  .scrim{position:fixed; inset:0; background:var(--scrim); z-index:60; animation:fade .18s ease}
  @keyframes fade{from{opacity:0}}
  .sheet{
    position:fixed; z-index:61; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(620px, calc(100vw - 32px)); max-height:calc(100dvh - 48px); overflow:auto;
    background:var(--surface); border-radius:28px; box-shadow:var(--edge), var(--shadow-pop); padding:22px 24px 24px;
    animation:rise .22s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.wide{width:min(880px, calc(100vw - 32px))}
  @keyframes rise{from{opacity:0; transform:translate(-50%,-47%) scale(.985)}}
  .sheet-h{display:flex; align-items:center; gap:10px; margin-bottom:16px}
  .sheet-h h2{flex:1; margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em}
  .sheet h2.big{margin:0 0 6px; font-size:25px; letter-spacing:-.02em}
  .stack{display:flex; flex-direction:column; gap:14px}
  .bigin{width:100%; border:0; background:var(--surface-2); border-radius:16px; padding:16px 18px; font-size:18px; outline:none}
  .bigin:focus{box-shadow:0 0 0 2px var(--accent)}
  .pchips{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .pchip{
    position:relative; display:inline-flex; align-items:center; gap:8px; padding:9px 13px; border-radius:12px;
    background:var(--surface-2); font-size:15px; font-weight:550; color:var(--ink); white-space:nowrap;
  }
  .pchip select{position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; font-size:16px}
  .pchip input[type=date]{border:0; background:transparent; font-size:15px; font-weight:550; padding:0; min-width:0; color:var(--ink)}
  .pchip svg{color:var(--mute)}
  .pchip .caret{color:var(--faint); font-size:11px}
  .why{font-size:14px; color:var(--mute); margin-top:-4px}
  .why b{color:var(--ink-2); font-weight:600}
  .added{display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--ink-2)}
  .added div{display:flex; gap:8px; align-items:center}
  .added svg{color:var(--good)}
  .field{display:flex; flex-direction:column; gap:6px}
  .field label{font-size:13px; font-weight:650; color:var(--mute)}
  .field input, .field select, .field textarea{border:0; background:var(--surface-2); border-radius:12px; padding:12px 14px; font-size:16px; width:100%}
  .field textarea{resize:vertical; min-height:42vh; line-height:1.55}
  .frow{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px}
  .ntitle{border:0; background:transparent; font-size:26px; font-weight:750; letter-spacing:-.02em; width:100%; padding:2px 0; outline:none}
  .sheet-foot{display:flex; gap:8px; margin-top:20px; align-items:center}
  .sheet-foot .grow{flex:1}
  .wiz-dots{display:flex; gap:6px}
  .wiz-dots i{width:26px; height:5px; border-radius:5px; background:var(--surface-3)}
  .wiz-dots i.on{background:var(--accent)}
  .pick{display:flex; gap:8px; flex-wrap:wrap}
  .pick button{
    border:0; padding:10px 15px; border-radius:12px; background:var(--surface-2); color:var(--ink-2); font-size:15px; font-weight:550;
    display:inline-flex; align-items:center; gap:8px; touch-action:manipulation;
  }
  .pick button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
  .pick button.lk[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-text); box-shadow:0 0 0 2px var(--accent) inset}
  .addf{display:flex; gap:8px}
  .addf input{flex:1; border:0; background:var(--surface-2); border-radius:12px; padding:11px 14px; font-size:16px; min-width:0}

  .pop{
    position:fixed; z-index:71; width:min(320px, calc(100vw - 24px)); background:var(--surface); border-radius:22px;
    box-shadow:var(--shadow-pop); padding:12px; border:1px solid var(--line-2);
  }
  .pop.w{width:min(372px, calc(100vw - 24px))}
  .pop-s{font-size:12px; font-weight:700; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; padding:12px 4px 8px}
  .emojis{display:grid; grid-template-columns:repeat(8, 1fr); gap:4px}
  .emojis button{aspect-ratio:1; border:0; border-radius:11px; background:transparent; font-size:21px; line-height:1; display:grid; place-items:center; padding:0; font-family:var(--round); font-weight:800; color:var(--mute)}
  .emojis button:hover{background:var(--surface-2)}
  .emojis button.cur{background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent)}
  .pop-h{font-size:14px; font-weight:650; padding:2px 4px 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pop-g{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
  .pop-g.subjects{grid-template-columns:repeat(2,1fr)}
  .pk{border:1px solid transparent; border-radius:11px; background:var(--surface-2); padding:9px 0 7px; display:flex; flex-direction:column; align-items:center; gap:1px; touch-action:manipulation}
  .pk b{font-family:var(--round); font-size:18px; font-weight:700; line-height:1.1}
  .pk span{font-size:11px; opacity:.75}
  .sbtn{border:0; border-radius:11px; padding:10px; display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:550; text-align:left; background:color-mix(in srgb, var(--c) var(--tint), var(--surface-2)); color:var(--ink); min-width:0}
  .sbtn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sbtn.cur{box-shadow:0 0 0 2px var(--c) inset}
  .pop-f{display:flex; gap:6px; margin-top:10px}
  .pop-f .btn{flex:1}
  .swatches{display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; padding:4px}
  .swatches button{width:100%; aspect-ratio:1; border-radius:50%; border:0; background:var(--c)}
  .swatches button.cur{box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--c)}

  .toast{
    position:fixed; z-index:80; left:50%; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%);
    display:flex; align-items:center; gap:14px; background:color-mix(in srgb, var(--ink) 92%, transparent); color:var(--bg); padding:11px 12px 11px 18px; border-radius:18px;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    font-size:15px; font-weight:550; box-shadow:var(--shadow-pop); max-width:calc(100vw - 32px); animation:rise2 .2s ease;
  }
  .toast span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .toast button{border:0; background:transparent; color:var(--bg); font-weight:700; font-size:15px; padding:4px 8px; border-radius:8px; text-decoration:underline; text-underline-offset:3px; flex:none}
  @keyframes rise2{from{opacity:0; transform:translate(-50%,8px)}}
  .confetti{position:fixed; z-index:90; pointer-events:none; width:8px; height:8px; border-radius:2px; animation:fly .95s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes fly{to{transform:translate(var(--dx), var(--dy)) rotate(var(--r)); opacity:0}}

  /* ---------- Fokus-Modus ---------- */
  .fov{position:fixed; inset:0; z-index:65; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px;
    background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(36px) saturate(160%); -webkit-backdrop-filter:blur(36px) saturate(160%);
    animation:fade .2s ease; text-align:center}
  .fov::before{content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(45% 40% at 50% 38%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%)}
  .fov .x{position:absolute; top:calc(16px + env(safe-area-inset-top, 0px)); right:16px}
  .fov .fk{font-size:13px; font-weight:750; color:var(--mute); text-transform:uppercase; letter-spacing:.08em}
  .fov h2{margin:4px 0 0; font-size:22px; font-weight:750; letter-spacing:-.02em; max-width:30ch}
  .fring{position:relative; width:min(300px, 70vw); aspect-ratio:1}
  .fring svg{width:100%; height:100%; transform:rotate(-90deg)}
  .fring .trk{stroke:var(--surface-3)} .fring .val{stroke:url(#g-ring)}
  .fring .clk{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .fring .clk b{font-family:var(--round); font-size:clamp(52px, 13vw, 72px); font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1}
  .fring .clk span{font-size:14px; color:var(--mute); margin-top:6px}
  .fov .fsel{border:0; background:var(--surface); border-radius:14px; padding:11px 14px; font-size:16px; max-width:min(420px, 86vw); box-shadow:var(--edge)}
  .fov .facts{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .fov .btn{min-width:120px}
  .fov .btn.block{width:auto; min-width:240px}

  /* ---------- Handy: Tab-Leiste unten ---------- */
  .tabbar, .fab, .m-gear{display:none}
  @media (max-width:779px){
    .app{grid-template-columns:minmax(0,1fr)}
    .side{display:none}
    .main{padding:20px 16px calc(112px + env(safe-area-inset-bottom, 0px))}
    .lt h1{font-size:31px}
    .lt-actions .btn.primary{display:none}
    /* Schwebende Glas-Kapsel statt fester Leiste */
    .tabbar{
      display:grid; grid-template-columns:repeat(5,1fr); position:fixed; left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom, 0px)); z-index:50;
      background:var(--glass); backdrop-filter:blur(28px) saturate(170%); -webkit-backdrop-filter:blur(28px) saturate(170%);
      border:1px solid var(--glass-line); border-radius:26px; box-shadow:var(--glass-hi), var(--shadow-pop); padding:6px;
    }
    .tabbar button{border:0; background:transparent; color:var(--mute); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; font-weight:650; padding:6px 0 5px; border-radius:20px; position:relative}
    .tabbar button[aria-current="page"]{color:var(--ink); background:color-mix(in srgb, var(--ink) 9%, transparent)}
    .tabbar button[aria-current="page"] svg{color:var(--accent)}
    .tabbar .tb{position:absolute; top:0; left:calc(50% + 6px); min-width:17px; height:17px; border-radius:9px; background:var(--bad); color:#fff; font-size:10.5px; display:grid; place-items:center; padding:0 4px}
    .fab{
      display:grid; place-items:center; position:fixed; right:18px; bottom:calc(92px + env(safe-area-inset-bottom, 0px)); z-index:51;
      width:58px; height:58px; border-radius:50%; border:0; background:var(--grad); color:#fff; box-shadow:0 16px 30px -12px rgba(242,85,122,.75);
    }
    .m-gear{display:grid}
    .sheet{left:0; right:0; top:auto; bottom:0; transform:none; width:auto; border-radius:28px 28px 0 0; max-height:94dvh; padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px)); animation:up .24s cubic-bezier(.2,.8,.2,1)}
    .sheet.wide{width:auto}
    @keyframes up{from{transform:translateY(30px); opacity:0}}
    .toast{bottom:calc(96px + env(safe-area-inset-bottom, 0px))}
  }
  @media (pointer:coarse){
    .pt{width:60px; height:48px}
    .nav{padding:12px}
    .row{min-height:62px}
    /* Kreis bleibt sichtbar 26 px, trifft aber auf 46 px */
    .ck{position:relative}
    .ck::before{content:""; position:absolute; inset:-10px; border-radius:50%}
    .iconbtn{width:44px; height:44px}
    .btn{min-height:44px}
    .seg button{min-height:40px; padding:9px 16px}
    .chip, .sugg button{min-height:44px; padding:10px 15px}
    .sh .more{min-height:44px; padding:0 4px}
    .lkt{min-height:44px; min-width:52px}
    .colorb{width:44px; height:44px}
    .tchip{min-height:40px}
    .subj input.mini, .subj input.nm{min-height:44px}
    .col-add{min-height:44px}
    .set select, .set input[type=date], .set input.fin{min-height:44px}
    .switch{min-height:44px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>

<script>
(() => {

  const faktor = () => state.modell.pruefungen === 4 ? 5 : 4;

  // Aktuelles Halbjahr aus dem Abi-Jahr: Schuljahr ab August, 2. Halbjahr ab Februar

  const toMin = (t) => { if (!t) return null; const [h, m] = String(t).split(":").map(Number); return isNaN(h) ? null : h * 60 + (m || 0); };
  const pStart = (i) => toMin((state.periodTimes || [])[i]);
  const fmtMin = (m) => pad(Math.floor(m / 60)) + ":" + pad(m % 60);

  /* ================= Woche ================= */
  function isoWeek(d) { const x = new Date(d); x.setDate(x.getDate() + 3 - (x.getDay() + 6) % 7); const w1 = new Date(x.getFullYear(), 0, 4); return 1 + Math.round(((x - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); }

  function renderZiel() {

    if (el.id === "abiDate") { state.abiDate = el.value; touch(); badges(); return; }
    if (el.id === "modPruef") { const n = +el.value; state.modell.pruefungen = n; while (state.exams.length < n) state.exams.push({ id:uid(), name:"Prüfungsfach " + (state.exams.length + 1), art:"mündlich", punkte:null }); while (state.exams.length > n) state.exams.pop(); touch(); badges(); return; }
    if (el.id === "modLk") { state.modell.lkDoppelt = el.value === "1"; touch(); badges(); return; }
  });

  document.addEventListener("input", (ev) => {
    const el = ev.target, d = el.dataset;
    if (el.id === "qText") { updateQuick(); return; }
    if (el.id === "nSearch") { noteQuery = el.value; const g = $("noteGrid"); if (g) g.innerHTML = noteGrid(); return; }
    if (el.id === "zielNote") { zielWert = +el.value; renderZiel(); return; }
    if (el.id === "uName") { state.name = el.value.slice(0, 40); touch(); return; }
    if (d.ef === "title" && sheetCtx && sheetCtx.kind === "task") { const t = state.tasks.find((x) => x.id === sheetCtx.id); if (t) { t.title = el.value; touch(); } return; }
    if (d.nfield && sheetCtx && sheetCtx.kind === "note") { const n = state.notes.find((x) => x.id === sheetCtx.id); if (n) { n[d.nfield] = el.value; n.updated = Date.now(); touch(); } return; }
    if (d.sname) { const s = subj(d.sname); if (s) { s.name = el.value; touch(); } return; }
    if (d.sroom) { const s = subj(d.sroom); if (s) { s.room = el.value.trim(); touch(); } return; }
    if (d.steach) { const s = subj(d.steach); if (s) { s.teacher = el.value.trim(); touch(); } return; }
    if (d.exname) { const e = state.exams.find((x) => x.id === d.exname); if (e) { e.name = el.value; touch(); } return; }
  });

  document.addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (ev.target.id === "fAdd") {
      const name = $("fName").value.trim(), from = $("fFrom").value, to = $("fTo").value || from;
      if (!name || !from) return;
      state.ferien.push({ id:uid(), name, from, to: to < from ? from : to }); touch(); render(); toast("Eingetragen: " + name); return;
    }
    if (ev.target.id === "qForm") submitQuick();
    if (ev.target.id === "wAdd") { const v = $("wAddIn").value.trim(); if (v && !wiz.sel.includes(v)) wiz.sel.push(v); renderWizard(); $("wAddIn").focus(); }
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { if (!$("fov").hidden) closeFocus(); else if (!$("pop").hidden) closePop(); else closeSheet(); return; }
    const typing = /^(input|textarea|select)$/i.test(ev.target.tagName);
    if (!typing && idle() && (ev.key === "n" || ev.key === "N") && !ev.metaKey && !ev.ctrlKey && !ev.altKey) { ev.preventDefault(); openNew(); return; }
    if ((ev.key === "Enter" || ev.key === " ") && !typing && ev.target.matches("[role=button]")) { ev.preventDefault(); ev.target.click(); }
  });
  let lastNarrow = null;
  window.addEventListener("resize", () => {
    if (popCtx && popCtx.anchor && popCtx.anchor.isConnected) placePop(popCtx.anchor, popCtx.kind === "cell");
    if (view === "woche" && weekMode === "woche") { const n = weekNarrow(); if (n !== lastNarrow) { lastNarrow = n; if (idle()) render(); } }
  });

  // Einmal pro Minute: Heute neu zeichnen, damit "jetzt", "morgen" und das Datum stimmen
  setInterval(() => { if (view === "heute" && idle() && !typingInMain() && document.visibilityState === "visible") render(); }, 60000);

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  /* ================= Start ================= */
  applyTheme(theme());
  state = loadLocal() || seed();
  try { view = localStorage.getItem(VKEY) || "heute"; } catch (e) {}
  if (!VIEWS.includes(view)) view = "heute";
  fRun = loadRun();
  render();
  if (fRun) tickOn();
  lastNarrow = weekNarrow();
  initDb();
})();
</script>

<script>
  // Offline-Fähigkeit
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  // In Safari geöffnet, aber noch nicht installiert: kurzer Hinweis
  (function () {
    var installed = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var dismissed = false; try { dismissed = localStorage.getItem("kurs.installhint") === "1"; } catch (e) {}
    if (installed || !ios || dismissed) return;
    var d = document.createElement("div"); d.className = "installhint";
    d.innerHTML = '<span><b>Als App installieren:</b> Teilen-Symbol → „Zum Home-Bildschirm“. Danach von dort starten.</span><button aria-label="Hinweis schließen">×</button>';
    d.querySelector("button").onclick = function () { d.remove(); try { localStorage.setItem("kurs.installhint", "1"); } catch (e) {} };
    document.body.appendChild(d);
  })();
</script>
</body>
</html>
