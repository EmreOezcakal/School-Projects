<!doctype html>
<html lang="de" data-app="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kurs">
<meta name="theme-color" content="#0D0D0F">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kurs · Schulplaner</title>
<style>
  /* =========================================================
     Tokens · ruhig und gedeckt: neutrale Flächen, feine Linien,
     ein Akzent (Lavendel), Rot nur für Überfälliges; Fachfarben nur im Stundenplan.
     Hell = Creme, Dunkel = Anthrazit (Standard der App)
     ========================================================= */
  :root{
    --bg:#F7F5F1; --side:#F1EEE8; --surface:#FFFFFF; --surface-2:#F5F2ED; --surface-3:#EBE7E0;
    --ink:#1D1B20; --ink-2:#48454E; --mute:#6F6B76; --faint:#AAA6B0;
    --line:rgba(29,27,32,.08); --line-2:rgba(29,27,32,.15);
    --accent:#6D5AE6; --accent-ink:#FFFFFF; --accent-soft:rgba(109,90,230,.10); --accent-text:#5B48D4;
    --good:#1E7D50; --warn:#9A5E00; --bad:#C03A55;
    --b5:#1E7D50; --b4:#3D6DB5; --b3:#69707F; --b2:#9A5E00; --b1:#C03A55;
    --fc0:#3D6DB5; --fc1:#B5633C; --fc2:#2F855F; --fc3:#8A58AE; --fc4:#B54F78;
    --fc5:#23828C; --fc6:#94701D; --fc7:#5E4FC7; --fc8:#60802A; --fc9:#69707F;
    --tint:10%; --tint-strong:16%;
    --edge:inset 0 0 0 1px rgba(29,27,32,.07);
    --shadow:0 1px 2px rgba(29,27,32,.05);
    --shadow-pop:0 24px 60px -20px rgba(29,27,32,.30), 0 0 0 1px rgba(29,27,32,.06);
    --scrim:rgba(29,27,32,.28);
    --r:14px;
    --ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --round:ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]):not(.theme-light){
      --bg:#0D0D0F; --side:#121214; --surface:#17171A; --surface-2:#1E1E22; --surface-3:#2A2A2F;
      --ink:#EEEDF0; --ink-2:#B8B6BE; --mute:#8A8892; --faint:#57555E;
      --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
      --accent:#A898FF; --accent-ink:#140F2E; --accent-soft:rgba(168,152,255,.13); --accent-text:#BFB3FF;
      --good:#6CCB9C; --warn:#E3B260; --bad:#F08A9C;
      --b5:#6CCB9C; --b4:#7EA6E6; --b3:#A3A8B5; --b2:#E3B260; --b1:#F08A9C;
      --fc0:#7EA6E6; --fc1:#E39A72; --fc2:#74C29D; --fc3:#C59BE3; --fc4:#E895B3;
      --fc5:#66C3CB; --fc6:#DDB866; --fc7:#A69CF2; --fc8:#A7C56F; --fc9:#A3A8B5;
      --tint:14%; --tint-strong:22%;
      --edge:inset 0 0 0 1px rgba(255,255,255,.06);
      --shadow:none;
      --shadow-pop:0 30px 70px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.08);
      --scrim:rgba(0,0,0,.7);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"], :root.theme-dark{
    --bg:#0D0D0F; --side:#121214; --surface:#17171A; --surface-2:#1E1E22; --surface-3:#2A2A2F;
    --ink:#EEEDF0; --ink-2:#B8B6BE; --mute:#8A8892; --faint:#57555E;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
    --accent:#A898FF; --accent-ink:#140F2E; --accent-soft:rgba(168,152,255,.13); --accent-text:#BFB3FF;
    --good:#6CCB9C; --warn:#E3B260; --bad:#F08A9C;
    --b5:#6CCB9C; --b4:#7EA6E6; --b3:#A3A8B5; --b2:#E3B260; --b1:#F08A9C;
    --fc0:#7EA6E6; --fc1:#E39A72; --fc2:#74C29D; --fc3:#C59BE3; --fc4:#E895B3;
    --fc5:#66C3CB; --fc6:#DDB866; --fc7:#A69CF2; --fc8:#A7C56F; --fc9:#A3A8B5;
    --tint:14%; --tint-strong:22%;
    --edge:inset 0 0 0 1px rgba(255,255,255,.06);
    --shadow:none;
    --shadow-pop:0 30px 70px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.08);
    --scrim:rgba(0,0,0,.7);
    color-scheme:dark;
  }
  :root.theme-light{ color-scheme:light }

  /* =========================================================
     Grundgerüst · eine Spalte, oben die Navigation, viel Luft
     ========================================================= */
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--ui); font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }
  button, input, select, textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  button:disabled{opacity:.45; cursor:default}
  .num{font-family:var(--round); font-variant-numeric:tabular-nums}
  svg.i{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  svg.i.sm{width:16px; height:16px}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* Kopfleiste: Marke links, vier Bereiche in der Mitte, „Mehr“ rechts */
  .top{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--line)}
  .top-in{max-width:1000px; margin:0 auto; padding:10px 20px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px}
  .brand{display:flex; align-items:center; gap:9px; font-weight:650; font-size:15px; color:var(--ink-2)}
  .logo{width:26px; height:26px; border-radius:7px; flex:none; display:block}
  .tabs{display:flex; gap:2px; padding:3px; border-radius:11px; background:var(--surface)}
  .tabs button{position:relative; border:0; background:transparent; color:var(--mute); font-size:14.5px; font-weight:550; padding:7px 16px; border-radius:8px}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-current="page"]{background:var(--surface-3); color:var(--ink)}
  .top-r{display:flex; justify-content:flex-end}
  .top-r .iconbtn[aria-current="page"]{color:var(--ink); background:var(--surface-3)}
  .tdot{position:absolute; top:6px; right:7px; width:6px; height:6px; border-radius:50%; background:var(--bad)}

  .main{min-width:0; padding:36px 20px 80px}
  .view{max-width:640px; margin:0 auto; container-type:inline-size}
  .view.wide{max-width:1000px}
  .lt{display:flex; align-items:flex-end; gap:12px; margin-bottom:28px}
  .lt > div:first-child{flex:1; min-width:0}
  .lt .kick{font-size:13.5px; color:var(--mute); margin-bottom:4px}
  .lt h1{font-size:30px; line-height:1.15; font-weight:700; letter-spacing:-.02em; margin:0}
  .lt .sub{font-size:14.5px; color:var(--mute); margin-top:4px}
  .lt-actions{display:flex; gap:8px; align-items:center; flex:none}

  .iconbtn{
    width:36px; height:36px; border-radius:10px; border:0; background:transparent; color:var(--mute);
    display:grid; place-items:center; flex:none;
  }
  .iconbtn:hover{color:var(--ink); background:var(--surface)}
  .iconbtn.plain{background:transparent}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 14px; border-radius:10px; border:0; background:var(--surface-2); color:var(--ink);
    font-size:14.5px; font-weight:600; white-space:nowrap; touch-action:manipulation;
  }
  .btn:hover{background:var(--surface-3)}
  .btn.primary{background:var(--accent); color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.sm{padding:6px 11px; font-size:13.5px; border-radius:9px}
  .btn.ghost{background:transparent; color:var(--accent-text)}
  .btn.ghost:hover{background:var(--accent-soft)}
  .btn.danger{background:transparent; color:var(--bad)}
  .btn.danger:hover{background:color-mix(in srgb, var(--bad) 10%, transparent)}
  .btn.block{width:100%; padding:12px 16px; font-size:15.5px}
  .btn:active, .iconbtn:active{transform:scale(.97)}
  .link{border:0; background:none; padding:0; color:var(--accent-text); font-weight:550; font-size:14.5px}

  .seg{display:inline-flex; padding:3px; border-radius:10px; background:var(--surface); gap:2px; max-width:100%; overflow-x:auto}
  .seg button{border:0; background:transparent; color:var(--mute); font-size:14px; font-weight:550; padding:6px 13px; border-radius:8px; white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--surface-3); color:var(--ink)}

  .sec{margin-top:34px}
  .sec:first-child{margin-top:0}
  .sh{display:flex; align-items:baseline; gap:8px; margin:0 0 6px}
  .sh h2{font-size:13px; font-weight:600; color:var(--mute); margin:0; letter-spacing:.01em}
  .sh .cnt{font-size:13px; color:var(--faint); font-variant-numeric:tabular-nums}
  .sh .more{margin-left:auto; font-size:13.5px; color:var(--accent-text); background:none; border:0; padding:0; font-weight:550}
  .sh.warn h2{color:var(--bad)}

  .card{background:var(--surface); border-radius:var(--r)}
  .pad{padding:16px}
  .muted{color:var(--mute)}
  .hint{font-size:13.5px; color:var(--mute); line-height:1.5}
  .hint a{color:var(--accent-text)}
  .grid2{display:grid; grid-template-columns:minmax(0,1fr); gap:24px}

  /* ---------- Listen: Zeilen mit Trennlinie, kein Kasten ---------- */
  .list{background:var(--surface); border-radius:var(--r); overflow:hidden}
  .list.plain{background:transparent; border-radius:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .row{
    display:flex; align-items:center; gap:14px; padding:12px 14px; position:relative; min-height:54px;
    cursor:pointer; transition:background .12s;
  }
  .list.plain .row{padding:12px 2px}
  .row + .row::before{content:""; position:absolute; top:0; left:50px; right:0; height:1px; background:var(--line)}
  .list.plain .row + .row::before{left:38px}
  .row:hover{background:color-mix(in srgb, var(--surface) 70%, transparent)}
  .row.add{color:var(--mute); font-weight:500; min-height:48px; font-size:15px}
  .row.add:hover{color:var(--accent-text)}
  .row.add .plus{width:22px; height:22px; display:grid; place-items:center}
  .r-body{flex:1; min-width:0}
  .r-title{font-size:16px; font-weight:450; line-height:1.35; overflow-wrap:break-word; hyphens:auto}
  .r-title .r-sub{color:var(--mute)}
  .r-meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:2px; font-size:13.5px; color:var(--mute)}
  .r-meta .sep{opacity:.5}
  .fd{width:8px; height:8px; border-radius:50%; background:var(--c, var(--faint)); display:inline-block; flex:none}
  .emo{font-style:normal; line-height:1; flex:none}
  .fname{color:var(--mute)}
  .tag{font-size:13.5px; color:var(--mute)}
  .tag.klausur{color:var(--bad); font-weight:600}
  .tag.test{color:var(--warn); font-weight:600}
  .due.over{color:var(--bad); font-weight:600}
  .due.soon{color:var(--ink-2)}

  /* Abhak-Kreis: neutral, beim Abhaken in Akzentfarbe */
  .ck{
    appearance:none; -webkit-appearance:none; margin:0; flex:none; width:22px; height:22px; border-radius:50%;
    border:1.6px solid var(--faint); background:transparent; cursor:pointer;
    display:grid; place-items:center; transition:background .15s, border-color .15s, transform .15s;
  }
  .ck:hover{border-color:var(--mute)}
  .ck::after{
    content:""; width:8px; height:4px; border-left:2.2px solid var(--accent-ink); border-bottom:2.2px solid var(--accent-ink);
    transform:rotate(-45deg) scale(0); margin-top:-2px; transition:transform .18s ease;
  }
  .ck:checked{background:var(--accent); border-color:var(--accent)}
  .ck:checked::after{transform:rotate(-45deg) scale(1)}
  .ck:active{transform:scale(.88)}
  .row.done .r-title{color:var(--mute); text-decoration:line-through; text-decoration-color:var(--faint)}
  .row.done .r-meta{opacity:.7}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
  .ck.pop{animation:pop .32s ease}

  /* Aufgaben als Tabelle (breit) */
  .tc{display:none}
  .thead{display:none}
  @container (min-width:600px){
    .tracker .row{display:grid; grid-template-columns:22px minmax(0,1fr) 150px 96px 90px; gap:14px}
    .tracker .r-meta{display:none}
    .tracker .tc{display:flex; align-items:center; gap:6px; min-width:0; font-size:14px; color:var(--mute); white-space:nowrap; overflow:hidden}
    .tracker .tc span{overflow:hidden; text-overflow:ellipsis}
    .tracker .thead{display:grid; grid-template-columns:22px minmax(0,1fr) 150px 96px 90px; gap:14px; padding:6px 2px; font-size:12.5px; font-weight:600; color:var(--faint); border-bottom:1px solid var(--line)}
    .tracker .thead + .row::before{display:none}
  }

  .chev{color:var(--faint); display:grid; margin-left:auto; flex:none}
  .row > svg.i{color:var(--mute)}
  .empty{padding:28px 12px; text-align:center; color:var(--mute); font-size:15px; display:flex; flex-direction:column; align-items:center; gap:8px}
  .empty svg{width:28px; height:28px; color:var(--faint)}
  .empty b{color:var(--ink); font-weight:600; font-size:16px}
  .empty span{max-width:40ch}
  .empty .btn{margin-top:6px}

  /* ---------- Heute ---------- */
  /* Eingabe direkt auf der Seite: tippen, Enter, fertig */
  .hq{display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:12px; padding:0 14px; margin-bottom:6px}
  .hq:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .hq svg{color:var(--mute)}
  .hq input{flex:1; min-width:0; border:0; background:transparent; padding:14px 0; font-size:16px; outline:none}
  .hq input::placeholder{color:var(--faint)}
  .hq-why{min-height:20px; font-size:13.5px; color:var(--mute); padding:0 4px; margin-bottom:6px}
  .hq-why b{color:var(--ink-2); font-weight:600}
  /* Ruhige Einzeiler unter der Liste */
  .lines{margin-top:34px; display:flex; flex-direction:column; border-top:1px solid var(--line)}
  .line{display:flex; align-items:center; gap:12px; padding:13px 2px; border:0; border-bottom:1px solid var(--line); background:transparent; text-align:left; width:100%; font-size:15px; color:var(--ink-2)}
  .line .lk{font-size:13px; color:var(--mute); width:118px; flex:none}
  .line .lv{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .line .lv b{color:var(--ink); font-weight:600}
  .line .chev{color:var(--faint); display:grid}
  button.line:hover .lv{color:var(--ink)}
  .live{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:1px; animation:blink 2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  .bad{color:var(--bad)}

  .setup{padding:18px; display:grid; gap:12px; margin-bottom:28px}
  .setup h3{margin:0; font-size:16px; font-weight:650}
  .setup p{margin:3px 0 0; color:var(--ink-2); font-size:14.5px; max-width:60ch}
  .steps{display:flex; flex-wrap:wrap; gap:8px}
  .step{display:inline-flex; align-items:center; gap:8px; padding:5px 11px 5px 6px; border-radius:999px; background:var(--surface-2); font-size:13.5px; color:var(--mute)}
  .step .sdot{width:18px; height:18px; border-radius:50%; border:1.6px solid var(--line-2); display:grid; place-items:center; font-size:10px; font-weight:800}
  .step.ok{color:var(--ink)} .step.ok .sdot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .setup .acts{display:flex; gap:8px; flex-wrap:wrap}

  /* ---------- Woche: Tag für Tag ---------- */
  .bar-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:22px}
  .bar-row .grow{flex:1}
  .day{margin-bottom:30px}
  .day-h{display:flex; align-items:baseline; gap:8px; margin:0 0 2px}
  .day-h b{font-size:16px; font-weight:650}
  .day-h span{color:var(--mute); font-size:14px}
  .day-h .now{color:var(--accent-text); font-size:13px; font-weight:600}
  .day.past{opacity:.55}
  .day-l{font-size:13.5px; color:var(--mute); margin:0 0 8px; overflow-wrap:anywhere}
  .day .list.plain{border-top:0}

  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; align-items:center}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; border:0; background:var(--surface); color:var(--mute); font-size:14px; font-weight:550; white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--surface-3); color:var(--ink)}
  .chip .c{font-size:12.5px; opacity:.7; font-variant-numeric:tabular-nums}
  .switch{display:inline-flex; align-items:center; gap:10px; font-size:14.5px; color:var(--ink-2); cursor:pointer; user-select:none}
  .switch input{appearance:none; -webkit-appearance:none; width:42px; height:26px; border-radius:999px; background:var(--surface-3); position:relative; margin:0; cursor:pointer; transition:background .2s; flex:none}
  .switch input::after{content:""; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s}
  .switch input:checked{background:var(--accent)}
  .switch input:checked::after{transform:translateX(16px)}

  /* ---------- Klausuren ---------- */
  .exam{display:flex; align-items:flex-start; gap:14px; padding:16px 2px; cursor:pointer}
  .ex-main{flex:1; min-width:0}
  .ex-t{font-size:16.5px; font-weight:600; line-height:1.3; overflow-wrap:break-word}
  .ex-s{font-size:14px; color:var(--mute); margin-top:3px}
  .ex-d{font-size:14.5px; color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums}
  .ex-d.soon{color:var(--bad); font-weight:600}
  .xitem{border-bottom:1px solid var(--line)}
  .xitem:first-child{border-top:1px solid var(--line)}
  .plan{display:flex; flex-direction:column; margin:-6px 0 14px 0}
  .plan .ps{display:flex; align-items:center; gap:12px; padding:7px 2px; font-size:15px; cursor:pointer}
  .plan .ps .ck{width:20px; height:20px}
  .plan .ps .ck::after{width:7px; height:3.5px; margin-top:-2px}
  .plan .ps .pd{margin-left:auto; color:var(--mute); font-size:13.5px; white-space:nowrap}
  .plan .ps.done span.t{color:var(--mute); text-decoration:line-through}
  .plan .ps.over .pd{color:var(--bad); font-weight:600}
  .xplan{margin:-6px 0 16px}

  /* ---------- Notizen ---------- */
  .search{display:flex; align-items:center; gap:8px; background:var(--surface); border-radius:10px; padding:0 12px; flex:1; min-width:200px}
  .search input{border:0; background:transparent; padding:10px 0; font-size:16px; width:100%; outline:none}
  .search svg{color:var(--mute)}
  .ngrid{columns:2 240px; column-gap:12px}
  .note{
    break-inside:avoid; margin:0 0 12px; display:block; width:100%; text-align:left; border:0; padding:14px 16px;
    background:var(--surface); border-radius:var(--r); color:var(--ink);
  }
  .note:hover{background:var(--surface-2)}
  .note .nf{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--mute)}
  .note .nt{font-size:16px; font-weight:600; margin-top:4px; line-height:1.25; overflow-wrap:anywhere}
  .note .nx{font-size:14px; color:var(--ink-2); margin-top:6px; white-space:pre-line; overflow:hidden; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow-wrap:anywhere; line-height:1.5}
  .note .nd{font-size:12.5px; color:var(--mute); margin-top:10px}

  /* ---------- Noten ---------- */
  .hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); overflow:hidden}
  @container (max-width:700px){ .hero{grid-template-columns:1fr} .hero-r{border-left:0 !important; border-top:1px solid var(--line)} }
  .hero-l{padding:20px; display:flex; flex-direction:column; align-items:center; text-align:center}
  .hero-r{padding:20px; display:flex; flex-direction:column; gap:14px; justify-content:center; border-left:1px solid var(--line)}
  .kicker{font-size:13px; color:var(--mute)}
  .gauge{width:min(260px, 100%); display:block}

<script>
(() => {
  "use strict";

  /* ================= Helfer ================= */
  const $ = (id) => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const icon = (id, cls = "") => '<svg class="i ' + cls + '"><use href="#i-' + id + '"/></svg>';
  const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  const fromISO = (s) => { const p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); };
  const daysUntil = (s) => s ? Math.round((fromISO(s) - today()) / 86400000) : null;
  const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
  const WDL = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  const MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const fmtDay = (s) => { const d = fromISO(s); return WD[d.getDay()] + " " + d.getDate() + "." + (d.getMonth()+1) + "."; };
  const longDay = (d) => WDL[d.getDay()] + ", " + d.getDate() + ". " + MON[d.getMonth()];
  const de = (n, dec = 1) => n.toFixed(dec).replace(".", ",");
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
  const reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  const coarse = !!(window.matchMedia && window.matchMedia("(pointer:coarse)").matches);
  // Läuft als eigenständige App vom Home-Bildschirm (nicht im claude.ai-Rahmen)?
  const STANDALONE = !!((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone || document.documentElement.dataset.app === "1");
  const APP_URL = "https://emreoezcakal.github.io/School-Projects/kurs/";
  // Übertragungscode: komplette Daten als Base64, damit Kopieren & Einfügen sicher klappt
  const toCode = (o) => { const b = new TextEncoder().encode(JSON.stringify(o)); let bin = ""; b.forEach((x) => { bin += String.fromCharCode(x); }); return "PK1." + btoa(bin); };
  function fromCode(txt) {
    const t = String(txt || "").trim();
    if (t.startsWith("{")) return JSON.parse(t);
    const b64 = t.replace(/^PK1\./, "").replace(/\s+/g, "");
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))));
  }

  const HJ = ["EF.1","EF.2","Q1.1","Q1.2","Q2.1","Q2.2"]; // Index 0–1 EF (zählt nicht), 2–5 Qualifikationsphase
  const COLORS = 10;
  const TYPES = ["Hausaufgabe","Test","Klausur","Referat","Abgabe","Lernen","Sonstiges"];
  const TAG = { Test:"test", Klausur:"klausur", Referat:"referat", Abgabe:"abgabe", Lernen:"lernen" };
  const EXAMS = ["Test","Klausur","Referat","Abgabe"];
  const COMMON = ["Deutsch","Mathematik","Englisch","Französisch","Spanisch","Latein","Biologie","Chemie","Physik","Informatik",
    "Geschichte","Erdkunde","Sozialwissenschaften","Politik","Wirtschaft","Pädagogik","Psychologie","Philosophie","Religion",
    "Kunst","Musik","Literatur","Sport","Projektkurs"];
  const SHORT = { Mathematik:"Mathe", Deutsch:"Deu", Englisch:"Eng", Französisch:"Frz", Spanisch:"Spa", Latein:"Lat", Biologie:"Bio",
    Chemie:"Chem", Physik:"Phy", Informatik:"Info", Geschichte:"Ge", Erdkunde:"Ek", Sozialwissenschaften:"SoWi", Politik:"Pol",
    Wirtschaft:"Wi", Pädagogik:"Päd", Psychologie:"Psy", Philosophie:"Phil", Religion:"Reli", Kunst:"Ku", Musik:"Mu", Literatur:"Lit", Sport:"Sport", Projektkurs:"PK", "Projektkurs Sport":"PK Sport" };
  // Fach-Symbole: Vorschlag nach Name, in „Stundenplan“ änderbar
  const ICON_RULES = [[/^projektkurs.*sport/, "🏅"], [/^mathe/, "📐"], [/^deutsch/, "✒️"], [/^englisch/, "🇬🇧"], [/^franz/, "🇫🇷"], [/^spanisch/, "🇪🇸"],
    [/^italien/, "🇮🇹"], [/^latein/, "🏛️"], [/^bio/, "🧬"], [/^chemie/, "⚗️"], [/^physik/, "⚛️"], [/^informatik/, "💻"], [/^geschichte/, "📜"],
    [/^(erdkunde|geo)/, "🌍"], [/^(sozialwiss|sowi|politik)/, "🗳️"], [/^wirtschaft/, "📈"], [/^päd/, "🌱"], [/^psych/, "🧠"], [/^philo/, "🦉"],
    [/^reli/, "🕊️"], [/^kunst/, "🎨"], [/^musik/, "🎵"], [/^literatur/, "📚"], [/^(darstell|theater)/, "🎭"], [/^sport/, "🏃"], [/^projektkurs/, "🧩"]];
  const defaultIcon = (name) => { const n = String(name || "").toLowerCase().trim(); const r = ICON_RULES.find(([re]) => re.test(n)); return r ? r[1] : ""; };
  const EMOJI = ["📐","➗","✒️","📖","📚","🇬🇧","🇫🇷","🇪🇸","🇮🇹","🏛️","🧬","🌱","⚗️","🧪","⚛️","🔭","💻","📜","🌍","🗳️","📈","🧠","🦉","🕊️","🎨","🎵","🎭","🏃","🏅","⚽","🧩"];

  /* ================= Daten ================= */
  let state = null;
  const emptyTT = () => ({ 1:[], 2:[], 3:[], 4:[], 5:[] });
  function defaultAbiDate() {
    const t = today(); let d = new Date(t.getFullYear(), 3, 19);
    if (d - t < 60 * 86400000) d = new Date(t.getFullYear() + 1, 3, 19);
    return iso(d);
  }
  function seed() {
    // Beispieldaten für Erstnutzer – deutlich als Beispiel markiert
    const mk = (name, lk, p, color) => ({ id:uid(), name, lk, p, color });
    const S = [
      mk("Mathematik", true, [12,13,11,13], 0), mk("Englisch", true, [11,12,12,12], 1), mk("Deutsch", false, [10,11,9,11], 3),
      mk("Biologie", false, [12,12,13,12], 2), mk("Geschichte", false, [10,9,11,10], 6), mk("Sozialwissenschaften", false, [11,10,12,11], 5),
      mk("Spanisch", false, [9,10,10,11], 4), mk("Sport", false, [13,14,13,14], 8), mk("Kunst", false, [12,11,12,12], 7), mk("Philosophie", false, [10,11,11,10], 9)
    ];
    const id = (n) => S.find((s) => s.name === n).id;
    const st = { v:3, demo:true, updatedAt:Date.now(), abiDate:defaultAbiDate(), modell:{ pruefungen:4, lkDoppelt:true },
      subjects:S, setup:{ done:true, subjects:true },
      timetable:{
        1:["Mathematik","Mathematik","Englisch","Englisch","Sozialwissenschaften","Philosophie"].map(id),
        2:["Deutsch","Deutsch","Spanisch","Englisch","Geschichte","Geschichte"].map(id),
        3:["Biologie","Biologie","Mathematik","Mathematik","Sport","Sport"].map(id),
        4:["Englisch","Englisch","Spanisch","Geschichte","Mathematik","Kunst"].map(id),
        5:["Deutsch","Biologie","Sozialwissenschaften","Sozialwissenschaften","Kunst","Kunst"].map(id)
      },
      exams:[
        { id:uid(), name:"Mathematik (LK)", art:"schriftlich", punkte:null }, { id:uid(), name:"Englisch (LK)", art:"schriftlich", punkte:null },
        { id:uid(), name:"Biologie", art:"schriftlich", punkte:null }, { id:uid(), name:"Geschichte", art:"mündlich", punkte:null }
      ], tasks:[], notes:[] };
    state = st;
    const L = (n, k = 0) => { let d = nextLesson(daysOf(id(n))) || nextSchoolDay(); for (let i = 0; i < k; i++) d = nextLesson(daysOf(id(n)), d) || addDays(d, 7); return iso(d); };
    const T = (title, f, typ, date) => ({ id:uid(), title, fach:id(f), typ, date, done:false });
    const klausur = T("Klausur Analysis", "Mathematik", "Klausur", L("Mathematik", 5));
    st.tasks = [
      T("S. 112 Nr. 4a–d", "Mathematik", "Hausaufgabe", L("Mathematik")),
      T("Arbeitsblatt Genetik fertig machen", "Biologie", "Hausaufgabe", iso(addDays(today(), -1))),
      T("Vokabeln Unit 3", "Spanisch", "Hausaufgabe", L("Spanisch")),
      T("Vokabeltest Unit 3", "Spanisch", "Test", L("Spanisch", 1)),
      T("Gedichtanalyse Heine", "Deutsch", "Abgabe", L("Deutsch", 1)),
      T("Referat Weimarer Republik", "Geschichte", "Referat", L("Geschichte", 4)),
      klausur
    ];
    st.tasks.push(...lernplan(klausur));
    st.notes = [
      { id:uid(), fach:id("Mathematik"), title:"Ableitungsregeln", updated:Date.now(), text:"Produktregel: (u·v)' = u'·v + u·v'\nQuotientenregel: (u/v)' = (u'·v − u·v') / v²\nKettenregel: f(g(x))' = f'(g(x)) · g'(x)" },
      { id:uid(), fach:id("Englisch"), title:"Themen für die Klausur", updated:Date.now() - 864e5, text:"Globalisation, The American Dream, Shakespeare – Sonnets.\nWortschatz aus Unit 2 wiederholen, Mediation üben." },
      { id:uid(), fach:id("Geschichte"), title:"Gliederung Referat", updated:Date.now() - 3*864e5, text:"1. Gründung 1918/19\n2. Krisenjahr 1923\n3. Goldene Zwanziger\n4. Weltwirtschaftskrise und Ende 1933" }
    ];
    return migrate(st);
  }

  // Ältere Stände (v1/v2) übernehmen, ohne Eingaben zu verlieren
  function migrate(o) {
    if (!o || !Array.isArray(o.subjects)) return null;
    o.subjects.forEach((s, i) => {
      if (!Array.isArray(s.p)) s.p = [null,null,null,null];
      if (!Array.isArray(s.ef)) s.ef = [null,null];
      if (!Array.isArray(s.belegt) || s.belegt.length !== 6) s.belegt = [true,true,true,true,true,true];
      if (typeof s.room !== "string") s.room = "";
      if (typeof s.teacher !== "string") s.teacher = "";
      if (typeof s.color !== "number") s.color = i % COLORS;
      if (typeof s.icon !== "string") s.icon = defaultIcon(s.name);
    });
    if (!Array.isArray(o.periodTimes)) o.periodTimes = [];
    if (!Array.isArray(o.ferien)) o.ferien = [];
    if (!o.timetable || typeof o.timetable !== "object") {
      o.timetable = emptyTT();
      o.subjects.forEach((s) => (s.days || []).forEach((d) => { if (o.timetable[d]) o.timetable[d].push(s.id); }));
    }
    for (let d = 1; d <= 5; d++) if (!Array.isArray(o.timetable[d])) o.timetable[d] = [];
    o.subjects.forEach((s) => { delete s.days; });
    if (!Array.isArray(o.exams)) o.exams = [];
    if (!o.modell) o.modell = { pruefungen:4, lkDoppelt:true };
    if (!Array.isArray(o.notes)) o.notes = [];
    if (!Array.isArray(o.tasks)) o.tasks = [];
    o.tasks.forEach((t) => { if (t.fach === undefined) t.fach = ""; if (!TYPES.includes(t.typ)) t.typ = "Sonstiges"; });
    if (!o.setup) { const tt = Object.values(o.timetable).some((a) => a.some(Boolean)); o.setup = { done:tt, subjects:tt }; }
    if (!o.abiDate) o.abiDate = defaultAbiDate();
    if (!Array.isArray(o.focus)) o.focus = [];
    if (typeof o.name !== "string") o.name = "";
    o.v = 6;
    return o;
  }

  const subj = (id) => state.subjects.find((s) => s.id === id) || null;
  const fcol = (s) => "var(--fc" + ((s && typeof s.color === "number" ? s.color : 9) % COLORS) + ")";
  const shortName = (s) => s ? (SHORT[s.name] || s.name.slice(0, 5)) : "";
  const letter = (s) => s ? (s.name.trim()[0] || "?").toUpperCase() : "?";
  // Fach-Symbol als Kachel (Zeitleiste, Jetzt) bzw. klein im Fließtext (sonst Farbpunkt)
  const mark = () => ""; // Listen bleiben einfarbig; Fachfarben nur im Stundenplan

  /* ================= Stundenplan ================= */
  // Ferien und freie Tage: an diesen Tagen gibt es keinen Unterricht
  const ferienOn = (d) => { const x = iso(d); return (state.ferien || []).find((f) => f.from <= x && x <= f.to) || null; };
  const isSchoolDay = (d) => { const w = d.getDay(); return w >= 1 && w <= 5 && !ferienOn(d); };
  function daysOf(id) { const r = []; for (let d = 1; d <= 5; d++) if ((state.timetable[d] || []).includes(id)) r.push(d); return r; }
  const hasTimetable = () => Object.values(state.timetable).some((a) => a.some(Boolean));
  function nextLesson(days, from) {
    if (!days || !days.length) return null;
    const t = from || today();
    for (let k = 1; k <= 70; k++) { const d = addDays(t, k); if (days.includes(d.getDay()) && !ferienOn(d)) return d; }
    return null;
  }
  function nextSchoolDay(from) {
    const t = from || today();
    for (let k = 1; k <= 70; k++) { const d = addDays(t, k); if (isSchoolDay(d)) return d; }
    return addDays(t, 1);
  }
  // Gibt es zwischen heute und d Ferien? Dann sagt die Begründung dazu, warum das Datum so weit weg ist
  function ferienBetween(d) { for (let x = addDays(today(), 1); x < d; x = addDays(x, 1)) { const f = ferienOn(x); if (f) return f; } return null; }
  function lessonsOn(dow) {
    // Doppelstunden zusammenfassen
    const arr = state.timetable[dow] || [], out = [];
    arr.forEach((id, i) => {
      if (!id) return;
      const last = out[out.length - 1];
      if (last && last.id === id && last.to === i) last.to = i + 1; else out.push({ from:i + 1, to:i + 1, id });
    });
    return out;
  }

  /* ================= Lernplan: verteilt lernen ================= */
  function lernplan(exam) {
    // Kürzer werdende Abstände vor dem Termin – 6, 3 und 1 Tag vorher; nur Tage ab heute
    const steps = [[6, "Stoff sammeln & zusammenfassen"], [3, "Aufgaben üben"], [1, "Ohne Unterlagen wiederholen"]];
    const t0 = today(), out = [];
    steps.forEach(([back, title], i) => {
      const d = addDays(fromISO(exam.date), -back);
      if (d < t0) return;
      out.push({ id:uid(), title, fach:exam.fach, typ:"Lernen", date:iso(d), done:false, exam:exam.id, step:i + 1 });
    });
    if (!out.length && daysUntil(exam.date) > 0) out.push({ id:uid(), title:"Wiederholen", fach:exam.fach, typ:"Lernen", date:iso(t0), done:false, exam:exam.id, step:3 });
    return out;
  }
  const planOf = (examId) => state.tasks.filter((t) => t.exam === examId).sort((a, b) => a.date.localeCompare(b.date));

  /* ================= Speichern & Sync ================= */
  const LS = "punktekonto.v1", LS_BASE = "punktekonto.base";
  let dbDoc = null, writeTimer = null, hadLocal = false;
  let base = null; // letzter bekannter Server-Stand – Grundlage für den Abgleich
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} clearTimeout(mirrorT); mirrorT = setTimeout(mirrorForPush, 800); }
  // Für Mitteilungen: kompakter Stand im Zwischenspeicher – der Service Worker formuliert daraus die Erinnerung.
  // Die Daten bleiben auf dem Gerät; der Absender im Netz schickt nur einen leeren Anstoß.
  let mirrorT = null;
  function mirrorForPush() {
    if (!STANDALONE || !window.caches) return;

  // Halbkreis 300–900 Punkte, drei Bereiche nach Note (bis 3,0 · bis 2,0 · besser), Markierung = aktueller Stand
  function gauge(pts) {
    const R = 80, cx = 100, cy = 98, ang = (p) => Math.PI * (1 - (Math.max(300, Math.min(900, p)) - 300) / 600);
    const pt = (p) => [cx + R * Math.cos(ang(p)), cy - R * Math.sin(ang(p))];
    const arc = (p1, p2, col) => { const a = pt(p1), b = pt(p2); return '<path d="M' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + ' A' + R + ' ' + R + ' 0 0 1 ' + b[0].toFixed(1) + ' ' + b[1].toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width="11" stroke-linecap="round"/>'; };
    const m = pt(pts);
    return '<svg class="gauge" viewBox="0 0 200 108" role="img" aria-label="' + pts + ' von 900 Punkten">' + arc(300, 900, "var(--surface-3)") +
      arc(306, 474, "color-mix(in srgb, var(--bad) 75%, transparent)") + arc(488, 652, "color-mix(in srgb, var(--warn) 75%, transparent)") + arc(666, 894, "color-mix(in srgb, var(--good) 75%, transparent)") +
      '<circle cx="' + m[0].toFixed(1) + '" cy="' + m[1].toFixed(1) + '" r="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/></svg>';
  }
  function renderZiel() {

    const per = rest > 0 ? (needB2 - c.b2) / (rest * f) : null;
    let out = 'Für <b>' + de(target) + '</b> brauchst du <b>' + need + '</b> Gesamtpunkte. Block I steht bei <b>' + c.b1 + '</b> – aus den Prüfungen müssen also <b>' + Math.max(0, needB2) + '</b> kommen.', v, cls;

      const t = state.tasks.find((x) => x.id === sheetCtx.id); if (!t) return;
      if (d.ef === "done") { t.done = el.checked; t.doneAt = el.checked ? Date.now() : null; }
      else if (d.ef === "date" && el.value) {
        const shift = Math.round((fromISO(el.value) - fromISO(t.date)) / 864e5); t.date = el.value;
        if (shift) planOf(t.id).forEach((p) => { p.date = iso(addDays(fromISO(p.date), shift)); });
      }
      else if (d.ef === "fach") { t.fach = el.value; planOf(t.id).forEach((p) => { p.fach = el.value; }); }
      else if (d.ef === "typ") t.typ = el.value;
      touch(); return;
    }
    if (d.nfSel !== undefined && sheetCtx && sheetCtx.kind === "note") {
      const n = state.notes.find((x) => x.id === sheetCtx.id); if (!n) return; n.fach = el.value; n.updated = Date.now(); touch();
      const s = subj(n.fach); $("nFachTxt").textContent = s ? s.name : "Allgemein"; $("nDot").style.setProperty("--c", s ? fcol(s) : "var(--faint)"); return;
    }
    if (d.exart) { const e = state.exams.find((x) => x.id === d.exart); if (e) { e.art = el.value; touch(); } return; }
    if (el.id === "abiDate") { state.abiDate = el.value; touch(); badges(); return; }
    if (el.id === "modPruef") { const n = +el.value; state.modell.pruefungen = n; while (state.exams.length < n) state.exams.push({ id:uid(), name:"Prüfungsfach " + (state.exams.length + 1), art:"mündlich", punkte:null }); while (state.exams.length > n) state.exams.pop(); touch(); badges(); return; }
    if (el.id === "modLk") { state.modell.lkDoppelt = el.value === "1"; touch(); badges(); return; }
  });

  document.addEventListener("input", (ev) => {
    const el = ev.target, d = el.dataset;
    if (el.id === "qText") { updateQuick(); return; }
    if (el.id === "hqText") { hqPreview(); return; }
    if (el.id === "nSearch") { noteQuery = el.value; const g = $("noteGrid"); if (g) g.innerHTML = noteGrid(); return; }
    if (el.id === "zielNote") { zielWert = +el.value; renderZiel(); return; }
    if (el.id === "uName") { state.name = el.value.slice(0, 40); touch(); return; }
    if (d.ef === "title" && sheetCtx && sheetCtx.kind === "task") { const t = state.tasks.find((x) => x.id === sheetCtx.id); if (t) { t.title = el.value; touch(); } return; }
    if (d.nfield && sheetCtx && sheetCtx.kind === "note") { const n = state.notes.find((x) => x.id === sheetCtx.id); if (n) { n[d.nfield] = el.value; n.updated = Date.now(); touch(); } return; }
    if (d.sname) { const s = subj(d.sname); if (s) { s.name = el.value; touch(); } return; }
    if (d.sroom) { const s = subj(d.sroom); if (s) { s.room = el.value.trim(); touch(); } return; }
    if (d.steach) { const s = subj(d.steach); if (s) { s.teacher = el.value.trim(); touch(); } return; }
    if (d.exname) { const e = state.exams.find((x) => x.id === d.exname); if (e) { e.name = el.value; touch(); } return; }
  });

  document.addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (ev.target.id === "fAdd") {
      const name = $("fName").value.trim(), from = $("fFrom").value, to = $("fTo").value || from;
      if (!name || !from) return;
      state.ferien.push({ id:uid(), name, from, to: to < from ? from : to }); touch(); render(); toast("Eingetragen: " + name); return;
    }
    if (ev.target.id === "qForm") submitQuick();
    if (ev.target.id === "hq") hqSubmit();
    if (ev.target.id === "wAdd") { const v = $("wAddIn").value.trim(); if (v && !wiz.sel.includes(v)) wiz.sel.push(v); renderWizard(); $("wAddIn").focus(); }
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { if (!$("fov").hidden) closeFocus(); else if (!$("pop").hidden) closePop(); else closeSheet(); return; }
    const typing = /^(input|textarea|select)$/i.test(ev.target.tagName);
    if (!typing && idle() && (ev.key === "n" || ev.key === "N") && !ev.metaKey && !ev.ctrlKey && !ev.altKey) { ev.preventDefault(); if ($("hqText")) $("hqText").focus(); else openNew(); return; }
    if ((ev.key === "Enter" || ev.key === " ") && !typing && ev.target.matches("[role=button]")) { ev.preventDefault(); ev.target.click(); }
  });
  let lastNarrow = null;
  window.addEventListener("resize", () => {
    if (popCtx && popCtx.anchor && popCtx.anchor.isConnected) placePop(popCtx.anchor, popCtx.kind === "cell");
    if (view === "woche" && weekMode === "woche") { const n = weekNarrow(); if (n !== lastNarrow) { lastNarrow = n; if (idle()) render(); } }
  });

  // Einmal pro Minute: Heute neu zeichnen, damit "jetzt", "morgen" und das Datum stimmen
  setInterval(() => { if (view === "heute" && idle() && !typingInMain() && document.visibilityState === "visible") render(); }, 60000);

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  /* ================= Start ================= */
  applyTheme(theme());
  state = loadLocal() || seed();
  setTimeout(mirrorForPush, 1500);
  try { view = localStorage.getItem(VKEY) || "heute"; } catch (e) {}
  if (!VIEWS.includes(view)) view = "heute";
  fRun = loadRun();
  render();
  if (fRun) tickOn();
  lastNarrow = weekNarrow();
  initDb();
})();
</script>

<script>
  // Offline-Fähigkeit
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  // In Safari geöffnet, aber noch nicht installiert: kurzer Hinweis
  (function () {
    var installed = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var dismissed = false; try { dismissed = localStorage.getItem("kurs.installhint") === "1"; } catch (e) {}
    if (installed || !ios || dismissed) return;
    var d = document.createElement("div"); d.className = "installhint";
    d.innerHTML = '<span><b>Als App installieren:</b> Teilen-Symbol → „Zum Home-Bildschirm“. Danach von dort starten.</span><button aria-label="Hinweis schließen">×</button>';
    d.querySelector("button").onclick = function () { d.remove(); try { localStorage.setItem("kurs.installhint", "1"); } catch (e) {} };
    document.body.appendChild(d);
  })();
</script>
</body>
